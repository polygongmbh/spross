org.gradle.jvmargs=-Xmx4g
org.gradle.configuration-cache=true

# why: the JDK 21 toolchain must be the one installed on the machine — never a
# silently downloaded copy; a missing JDK 21 fails the build instead of hiding.
# Homebrew kegs are invisible to Gradle's auto-detection, so the path is named;
# Linux distro JDKs under /usr/lib/jvm are auto-detected and need no entry.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
