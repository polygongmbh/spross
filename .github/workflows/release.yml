name: release

# why: the tag is both the trigger and the version — every artifact below reads
# ${GITHUB_REF_NAME#v}, so cutting a build never means bumping a number twice.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        run: echo "SPROSS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Release key from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.SPROSS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SPROSS_KEYSTORE_BASE64 is unset — the APK would install once and never update"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The pre-commit hook's text lints run only on a clone that set hooksPath;
      # this is the backstop for what slipped past it.
      - name: Text lints
        run: |
          python3 scripts/catalog-format.py --check
          python3 scripts/strings.py --check-format App/Sources/Resources/Localizable.xcstrings
          python3 scripts/chrome.py
          python3 scripts/card-parity.py --check
          python3 scripts/doc-header.py --check
          python3 scripts/audio-coverage.py --check
          python3 scripts/turn-machine-homes.py --check

      - name: Test and assemble
        env:
          SPROSS_KEYSTORE: ${{ runner.temp }}/release.jks
          SPROSS_KEYSTORE_PASSWORD: ${{ secrets.SPROSS_KEYSTORE_PASSWORD }}
          SPROSS_KEY_ALIAS: ${{ secrets.SPROSS_KEY_ALIAS }}
        run: ./gradlew --console=plain -q :kern:jvmTest -Psweeps :android:testDebugUnitTest :android:assembleRelease

      - name: Name it after the release
        run: |
          mkdir -p dist
          cp android/build/outputs/apk/release/*-release.apk "dist/spross-$SPROSS_VERSION.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: App Store
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # why: the project is authored against Swift 6.0 and a pinned Kotlin/SKIE pair.
      # The image's default Xcode moves with the image, so the version is named here —
      # a missing one fails loudly instead of silently shifting the language mode.
      - run: sudo xcode-select -switch /Applications/Xcode_26.6.app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # The Kotlin/Native toolchain is a ~1.5 GB download the release framework needs.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Version from tag
        run: echo "SPROSS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Spross.xcodeproj is generated, never committed.
      - run: brew install xcodegen
      - run: scripts/gen.sh

      - name: App Store Connect API key from secret
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::APPSTORE_API_PRIVATE_KEY is unset — signing cannot fetch a profile"
            exit 1
          fi
          printf '%s' "$ASC_PRIVATE_KEY" | base64 -d > "$RUNNER_TEMP/asc.p8"

      # why: the archive and both exports sign with the team's distribution certificate
      # and nothing else — automatic signing would mint a development certificate on every
      # fresh runner, and Apple's cloud-managed fallback is refused to an App Manager key.
      - name: Distribution certificate from secret
        env:
          DIST_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          if [ -z "$DIST_P12" ]; then
            echo "::error::APPLE_DISTRIBUTION_P12 is unset — the archive has no certificate to sign with"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$DIST_P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # why: finds or creates an App Store profile per target on that certificate, installs
      # them, and sets SPROSS_PROFILE_<target>, which project.yml's specifier reads.
      - name: App Store profiles
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
        run: python3 scripts/asc-profiles.py app-store --export-options "$RUNNER_TEMP/app-store.plist" >> "$GITHUB_ENV"

      - name: Archive
        id: archive
        run: |
          xcodebuild -project Spross.xcodeproj -scheme Spross \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Spross.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            SPROSS_PROFILE_Spross="$SPROSS_PROFILE_Spross" \
            SPROSS_PROFILE_SprossWidgets="$SPROSS_PROFILE_SprossWidgets" \
            SPROSS_PROFILE_SprossWatch="$SPROSS_PROFILE_SprossWatch" \
            SPROSS_PROFILE_SprossWatchWidgets="$SPROSS_PROFILE_SprossWatchWidgets" \
            MARKETING_VERSION="$SPROSS_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -quiet archive

      # why: the iOS job's purpose — App Store Connect receives the build, internal TestFlight
      # testers have it minutes later, and the same build goes to App Review from there.
      # A failure here fails this job; the GitHub release still goes out with the APK.
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Spross.xcarchive" \
            -exportPath "$RUNNER_TEMP/app-store" \
            -exportOptionsPlist "$RUNNER_TEMP/app-store.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet

      # why: an extra for registered devices, re-signed off the same archive with an ad-hoc
      # profile per target that the script keeps in step with the registered devices.
      # It never fails the run: without it the release simply carries no IPA.
      - name: Ad-hoc IPA
        id: adhoc
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
        run: |
          python3 scripts/asc-profiles.py ad-hoc --export-options "$RUNNER_TEMP/ad-hoc.plist" > /dev/null
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Spross.xcarchive" \
            -exportPath "$RUNNER_TEMP/ad-hoc" \
            -exportOptionsPlist "$RUNNER_TEMP/ad-hoc.plist" \
            -quiet
          mkdir -p dist
          cp "$RUNNER_TEMP/ad-hoc/Spross.ipa" "dist/spross-$SPROSS_VERSION.ipa"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.adhoc.outcome == 'success' }}
        continue-on-error: true
        with:
          name: ipa
          path: dist/*.ipa
          if-no-files-found: error

  publish:
    name: GitHub Release
    # why: it waits for the iOS job but does not depend on it — an Apple-side failure must
    # not take the Android release with it, and Obtainium can only offer what a release
    # actually carries.
    needs: [android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ipa
          path: dist

      - name: Version from tag
        run: |
          echo "SPROSS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          # why: the IPA is optional, so everything iPhone-shaped below is written
          # only when its artifact actually arrived.
          ls dist/spross-*.ipa >/dev/null 2>&1 && echo "HAS_IPA=1" >> "$GITHUB_ENV" || true

      # why: an iPhone installs an ad-hoc build from an itms-services link, and that
      # link points at a manifest rather than the payload — so the manifest has to
      # name the asset URL the release is about to have.
      - name: Over-the-air install manifest
        if: env.HAS_IPA
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > "dist/manifest.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array><dict>
              <key>kind</key><string>software-package</string>
              <key>url</key><string>${base}/spross-${SPROSS_VERSION}.ipa</string>
            </dict></array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>net.spross.app</string>
              <key>bundle-version</key><string>${SPROSS_VERSION}</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>Spross</string>
            </dict>
          </dict></array></dict></plist>
          PLIST

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$SPROSS_VERSION" > notes.md
          cat >> notes.md <<NOTES

          ## Install

          **Android** — [\`spross-$SPROSS_VERSION.apk\`](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/spross-$SPROSS_VERSION.apk),
          or add \`https://github.com/${GITHUB_REPOSITORY}\` in [Obtainium](https://github.com/ImranR98/Obtainium) to be offered every release from here on.
          NOTES

          assets=(dist/spross-*.apk)
          # The heredoc body sits at column 0 on purpose — leading spaces would survive
          # into the release notes as markdown indentation.
          if [ -n "${HAS_IPA:-}" ]; then
            manifest="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/manifest.plist"
            cat >> notes.md <<NOTES

          **iPhone** — registered test devices only. Open this in Safari on the device:

          \`itms-services://?action=download-manifest&url=$manifest\`
          NOTES
            assets+=(dist/spross-*.ipa dist/manifest.plist)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "Spross $SPROSS_VERSION" \
            --notes-file notes.md \
            "${assets[@]}"
