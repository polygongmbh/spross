name: Spross
options:
  bundleIdPrefix: net.spross
  # why: the String Catalog (App/Sources/Resources/Localizable.xcstrings) is
  # authored with German as the development language; UI chrome renders in the
  # user's KNOWN language (de, or en until sw/uk UIs are authored).
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
# why: settings shared by ALL targets live here — per-target copies drift, and the
# project is GENERATED, so a setting left to the IDE is discarded by the next
# regeneration: what signing needs belongs here or it does not survive.
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 7.1.0
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # why: SprossKern ships ONE simulator slice, arm64 (scripts/build-kern.sh).
    # A scheme built without a concrete destination — the watch-widgets scheme is
    # one — falls back to the generic simulator, whose standard ARCHS adds
    # x86_64; that slice finds no kern module and every Kotlin type goes missing
    # at once. The watch SDKs never match this condition and are unaffected.
    # The extension auto-schemes resolve a NAMED iPhone destination erratically
    # too, so gate on the `Spross` scheme (it builds the whole embed chain) or on
    # `-scheme SprossWatchWidgets -destination 'generic/platform=iOS Simulator'`.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  # why: the two Apple accounts are separate teams and an identifier belongs to ONE
  # of them, so each config signs with the team that owns what it claims. Debug is
  # the personal team, which owns group.net.spross.app; Release is the paid team,
  # which owns group.net.spross.data and alone can issue a distribution certificate
  # (docs/distribution.md). The entitlements read APP_GROUP_ID rather than naming a
  # group, so one generated file per target serves both. Getting the pair wrong is
  # expensive: a device build registers whatever the entitlement claims to the team
  # that signs it, and an identifier never moves between teams afterwards.
  configs:
    Debug:
      DEVELOPMENT_TEAM: 2LDZV9286Q
      APP_GROUP_ID: group.net.spross.app
    Release:
      DEVELOPMENT_TEAM: AF77U46UQ6
      APP_GROUP_ID: group.net.spross.data
targets:
  Spross:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - Shared/Sources
      - path: catalog
        type: folder
        buildPhase: resources
      # why: the required-reason API declaration is read off the bundle root, so
      # every shipped bundle carries its own — the app's does not cover the
      # widget or the watch app, which are separate bundles to App Store Connect.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: SprossWidgets
        embed: true
      - target: SprossWatch
        embed: true
    # why: SprossKern is a Kotlin/Native static framework built by Gradle and
    # linked via search path + ldflags, not SwiftPM (binaryTarget has wrong
    # build ordering and deadlocks on clean checkouts). Only the APP target
    # links Kotlin — widget/watch targets stay decode-only Swift.
    preBuildScripts:
      - name: Build SprossKern
        script: exec sh "$SRCROOT/scripts/build-kern.sh"
        basedOnDependencyAnalysis: false
    entitlements:
      path: App/Spross.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
    # why: UIBackgroundModes is one of the few keys `INFOPLIST_KEY_*` cannot
    # reach — Xcode honors a fixed list and this is not on it — so the app gets
    # a base plist that the generated keys are merged into. It carries this one
    # key: the listening run is meant for a pocket, and one that stopped at the
    # lock screen would be a mode for staring at a phone that is speaking.
    info:
      path: App/Info.plist
      properties:
        # why: the shared base settings own the version — xcodegen's own default
        # would freeze this plist at 1.0 and win over MARKETING_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.spross.app
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/kern/build/xcode/$(CONFIGURATION)"
        OTHER_LDFLAGS: "$(inherited) -framework SprossKern"
        # why: the pre-build phase runs Gradle, which writes outside
        # Xcode-declared outputs; user-script sandboxing would kill it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spross
        # why: files the app under Education on the App Store and in the
        # device's App Library / Screen Time grouping.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # why: no network request and no cryptography anywhere in the app, so the
        # export-compliance answer is settled — declared here, or App Store Connect
        # asks it by hand on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SprossWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/Sources
      - Shared/Sources/AppGroup.swift
      - path: Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: Widgets/SprossWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Spross
        # why: extensions must match the host app's version or the build warns
        # and App Store rejects; inherit from the shared base settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # why: extension bundle ids must be prefixed by the host app's id,
        # or simctl/App Store installs fail with "Mismatched bundle IDs".
        PRODUCT_BUNDLE_IDENTIFIER: net.spross.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
  SprossWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch/Sources
      - Watch/Resources
      - Shared/Sources
      - path: Watch/Fixtures
        buildPhase: resources
      - path: Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: SprossWatchWidgets
        embed: true
    entitlements:
      path: Watch/SprossWatch.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
    settings:
      base:
        # why: watch-app bundle id must be "<ios-app-id>.watchkitapp" and the
        # companion key must point back, or the iOS embed is rejected.
        PRODUCT_BUNDLE_IDENTIFIER: net.spross.app.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: net.spross.app
        INFOPLIST_KEY_CFBundleDisplayName: Spross
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SprossWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - WatchWidgets/Sources
      - Shared/Sources
      - path: WatchWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: WatchWidgets/SprossWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Spross
        # why: extensions must match the host app's version or the build warns
        # and App Store rejects; inherit from the shared base settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.spross.app.watchkitapp.Widgets
        TARGETED_DEVICE_FAMILY: "4"
      # why: the capitalized id is registered to the paid team and cannot be taken
      # in the personal one, alone among the four — debug signs a lowercase twin.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: net.spross.app.watchkitapp.widget

# why: xcodegen writes no schemes unless they are declared, and every gate, script and
# runbook line reaches the app through `-scheme Spross` (CLAUDE.md, README.md,
# scripts/run-sim.sh). Without this block a regenerate leaves "This project contains no
# schemes" and a `-target` build silently resolves to the DEVICE SDK instead.
schemes:
  Spross:
    build:
      targets:
        Spross: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
