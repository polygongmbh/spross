name: Spross
options:
  bundleIdPrefix: net.spross
  # why: the String Catalog (App/Sources/Resources/Localizable.xcstrings) is
  # authored with German as the development language; UI chrome renders in the
  # user's KNOWN language (de, or en until sw/uk UIs are authored).
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
# why: settings shared by ALL targets live here — per-target copies drift,
# and a missing DEVELOPMENT_TEAM meant every regeneration wiped the team
# set in Xcode.
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 4.0.0
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2LDZV9286Q
    # why: SprossKern ships ONE simulator slice, arm64 (scripts/build-kern.sh).
    # A scheme built without a concrete destination — the watch-widgets scheme is
    # one — falls back to the generic simulator, whose standard ARCHS adds
    # x86_64; that slice finds no kern module and every Kotlin type goes missing
    # at once. The watch SDKs never match this condition and are unaffected.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Spross:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - Shared/Sources
      - path: catalog
        type: folder
        buildPhase: resources
      # why: the required-reason API declaration is read off the bundle root, so
      # every shipped bundle carries its own — the app's does not cover the
      # widget or the watch app, which are separate bundles to App Store Connect.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: SprossWidgets
        embed: true
      - target: SprossWatch
        embed: true
    # why: SprossKern is a Kotlin/Native static framework built by Gradle and
    # linked via search path + ldflags, not SwiftPM (binaryTarget has wrong
    # build ordering and deadlocks on clean checkouts). Only the APP target
    # links Kotlin — widget/watch targets stay decode-only Swift.
    preBuildScripts:
      - name: Build SprossKern
        script: exec sh "$SRCROOT/scripts/build-kern.sh"
        basedOnDependencyAnalysis: false
    entitlements:
      path: App/Spross.entitlements
      properties:
        com.apple.security.application-groups: [group.net.spross.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.spross.app
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/kern/build/xcode/$(CONFIGURATION)"
        OTHER_LDFLAGS: "$(inherited) -framework SprossKern"
        # why: the pre-build phase runs Gradle, which writes outside
        # Xcode-declared outputs; user-script sandboxing would kill it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spross
        # why: files the app under Education on the App Store and in the
        # device's App Library / Screen Time grouping.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # why: no network request and no cryptography anywhere in the app, so the
        # export-compliance answer is settled — declared here, or App Store Connect
        # asks it by hand on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SprossWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/Sources
      - path: Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: Widgets/SprossWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.net.spross.app]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Spross
        # why: extensions must match the host app's version or the build warns
        # and App Store rejects; inherit from the shared base settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # why: extension bundle ids must be prefixed by the host app's id,
        # or simctl/App Store installs fail with "Mismatched bundle IDs".
        PRODUCT_BUNDLE_IDENTIFIER: net.spross.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
  SprossWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch/Sources
      - Watch/Resources
      - Shared/Sources
      - path: Watch/Fixtures
        buildPhase: resources
      - path: Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: SprossWatchWidgets
        embed: true
    entitlements:
      path: Watch/SprossWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.net.spross.app]
    settings:
      base:
        # why: watch-app bundle id must be "<ios-app-id>.watchkitapp" and the
        # companion key must point back, or the iOS embed is rejected.
        PRODUCT_BUNDLE_IDENTIFIER: net.spross.app.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: net.spross.app
        INFOPLIST_KEY_CFBundleDisplayName: Spross
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SprossWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - WatchWidgets/Sources
      - Shared/Sources
      - path: WatchWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: WatchWidgets/SprossWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.net.spross.app]
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Spross
        # why: extensions must match the host app's version or the build warns
        # and App Store rejects; inherit from the shared base settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.spross.app.watchkitapp.Widgets
        TARGETED_DEVICE_FAMILY: "4"
