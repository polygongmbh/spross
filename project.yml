name: DuoLernen
options:
  bundleIdPrefix: dev.tj
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
# why: settings shared by ALL targets live here — per-target copies drift,
# and a missing DEVELOPMENT_TEAM meant every regeneration wiped the team
# set in Xcode.
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.8.1
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2LDZV9286Q
packages:
  DuoKern:
    path: Kern
targets:
  DuoLernen:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - Shared/Sources
      - path: content
        type: folder
        buildPhase: resources
    dependencies:
      - package: DuoKern
        product: DuoKern
      - package: DuoKern
        product: DuoKernTrainer
      - target: DuoLernenWidgets
        embed: true
      - target: DuoLernenWatch
        embed: true
    entitlements:
      path: App/DuoLernen.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.tj.duolernen]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  DuoLernenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/Sources
    dependencies:
      - package: DuoKern
    entitlements:
      path: Widgets/DuoLernenWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.tj.duolernen]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: DuoLernen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # why: extension bundle ids must be prefixed by the host app's id,
        # or simctl/App Store installs fail with "Mismatched bundle IDs".
        PRODUCT_BUNDLE_IDENTIFIER: dev.tj.DuoLernen.Widgets
        TARGETED_DEVICE_FAMILY: "1"
  DuoLernenWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch/Sources
      - Shared/Sources
      - path: Watch/Fixtures
        buildPhase: resources
    dependencies:
      - package: DuoKern
      - target: DuoLernenWatchWidgets
        embed: true
    entitlements:
      path: Watch/DuoLernenWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.tj.duolernen]
    settings:
      base:
        # why: watch-app bundle id must be "<ios-app-id>.watchkitapp" and the
        # companion key must point back, or the iOS embed is rejected.
        PRODUCT_BUNDLE_IDENTIFIER: dev.tj.DuoLernen.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.tj.DuoLernen
        INFOPLIST_KEY_CFBundleDisplayName: DuoLernen
        TARGETED_DEVICE_FAMILY: "4"
  DuoLernenWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - WatchWidgets/Sources
      - Shared/Sources
    dependencies:
      - package: DuoKern
    entitlements:
      path: WatchWidgets/DuoLernenWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.tj.duolernen]
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: DuoLernen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tj.DuoLernen.watchkitapp.Widgets
        TARGETED_DEVICE_FAMILY: "4"
